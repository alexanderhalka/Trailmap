services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trailmap
      POSTGRES_PASSWORD: trailmap
      POSTGRES_DB: trailmap
    ports:
      - "5432:5432"
    volumes:
      - trailmap_pgdata:/var/lib/postgresql/data

volumes:
  trailmap_pgdata:
